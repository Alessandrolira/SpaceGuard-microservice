spring:
  application:
    name: spaceguard

  rabbitmq:
    addresses: "${RABBITMQ_URL}"

  ai:
    openai:
      api-key: "${OPENAI_API_KEY}"
      chat:
        options:
          model: gpt-4o-mini

  datasource:
    url: "${DB_URL:jdbc:postgresql://localhost:5432/spaceguard}"
    username: "${DB_USERNAME:postgres}"
    password: "${DB_PASSWORD}"
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false

security:
  jwt:
    secret: "${JWT_SECRET}"
    expiration-minutes: "${JWT_EXPIRATION_MINUTES:60}"


app:
  cors:
    allowed-origin-patterns:
      - "http://localhost:*"
      - "http://127.0.0.1:*"
      - "http://192.168.*:*"
      - "http://10.*:*"
      - "http://172.*:*"
