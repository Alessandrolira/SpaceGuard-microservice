<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="760" viewBox="0 0 1180 760" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#37474f"/>
    </marker>
    <style>
      .title  { font-size: 26px; font-weight: 700; fill: #102a43; }
      .sub    { font-size: 13px; fill: #486581; }
      .zone   { font-size: 14px; font-weight: 700; fill: #0b6bcb; }
      .box    { font-size: 14px; font-weight: 600; fill: #102a43; }
      .small  { font-size: 11.5px; fill: #486581; }
      .lbl    { font-size: 11.5px; fill: #37474f; }
      .white  { fill: #ffffff; font-weight: 600; font-size: 13px; }
    </style>
  </defs>

  <!-- Fundo -->
  <rect x="0" y="0" width="1180" height="760" fill="#f8fafc"/>

  <!-- Titulo -->
  <text x="40" y="46" class="title">SpaceGuard — Arquitetura Macro (Azure DevOps + Azure)</text>
  <text x="40" y="68" class="sub">Microsservicos Java/Spring Boot · CI/CD no Azure DevOps · Deploy em containers (ACR + ACI)</text>

  <!-- ===================== Azure DevOps ===================== -->
  <rect x="40" y="100" width="300" height="600" rx="12" fill="#e8f1fb" stroke="#9cc3ec" stroke-width="1.5"/>
  <text x="60" y="128" class="zone">Azure DevOps (Projeto privado)</text>

  <!-- Dev -->
  <rect x="70" y="145" width="240" height="58" rx="8" fill="#ffffff" stroke="#9cc3ec"/>
  <text x="86" y="170" class="box">Desenvolvedor (RM)</text>
  <text x="86" y="190" class="small">cria Task · branch · commit · Pull Request</text>

  <!-- Boards -->
  <rect x="70" y="220" width="240" height="62" rx="8" fill="#ffffff" stroke="#9cc3ec"/>
  <text x="86" y="245" class="box">Azure Boards</text>
  <text x="86" y="265" class="small">Work Item vinculado a commits/PRs</text>

  <!-- Repos -->
  <rect x="70" y="299" width="240" height="74" rx="8" fill="#ffffff" stroke="#9cc3ec"/>
  <text x="86" y="324" class="box">Azure Repos (Git)</text>
  <text x="86" y="343" class="small">branch main PROTEGIDA</text>
  <text x="86" y="360" class="small">revisor + work item obrigatorios</text>

  <!-- Pipelines -->
  <rect x="70" y="390" width="240" height="290" rx="8" fill="#ffffff" stroke="#9cc3ec"/>
  <text x="86" y="415" class="box">Azure Pipelines</text>

  <rect x="86" y="430" width="208" height="110" rx="6" fill="#eef7ee" stroke="#8fc98f"/>
  <text x="98" y="451" class="box">CI — Build</text>
  <text x="98" y="470" class="small">mvn package (2 servicos)</text>
  <text x="98" y="487" class="small">testes JUnit publicados</text>
  <text x="98" y="504" class="small">artefato (JARs) publicado</text>
  <text x="98" y="521" class="small">az acr build → imagens</text>

  <rect x="86" y="552" width="208" height="116" rx="6" fill="#fff4e5" stroke="#f0c27b"/>
  <text x="98" y="573" class="box">CD — Release</text>
  <text x="98" y="592" class="small">roda automatico apos a CI</text>
  <text x="98" y="609" class="small">envsubst no template ACI</text>
  <text x="98" y="626" class="small">az container create</text>
  <text x="98" y="643" class="small">deploy do Container Group</text>
  <text x="98" y="660" class="small">(usa segredos protegidos)</text>

  <!-- setas internas DevOps -->
  <line x1="190" y1="203" x2="190" y2="220" stroke="#37474f" marker-end="url(#arrow)"/>
  <line x1="190" y1="282" x2="190" y2="299" stroke="#37474f" marker-end="url(#arrow)"/>
  <line x1="190" y1="373" x2="190" y2="390" stroke="#37474f" marker-end="url(#arrow)"/>
  <line x1="190" y1="540" x2="190" y2="552" stroke="#37474f" marker-end="url(#arrow)"/>

  <!-- ===================== Azure (nuvem) ===================== -->
  <rect x="380" y="100" width="600" height="600" rx="12" fill="#eaf6ef" stroke="#8fc98f" stroke-width="1.5"/>
  <text x="400" y="128" class="zone" fill="#1b7f4b">Microsoft Azure — Resource Group (rg-spaceguard)</text>

  <!-- ACR -->
  <rect x="410" y="150" width="250" height="90" rx="8" fill="#ffffff" stroke="#8fc98f"/>
  <text x="426" y="176" class="box">Azure Container Registry</text>
  <text x="426" y="196" class="small">imagens: spaceguard,</text>
  <text x="426" y="212" class="small">inpe-ingestor, spaceguard-db</text>
  <text x="426" y="231" class="small">(provisionado via Azure CLI)</text>

  <!-- ACI Container Group -->
  <rect x="410" y="270" width="540" height="320" rx="10" fill="#ffffff" stroke="#5aa469" stroke-width="1.5"/>
  <text x="426" y="296" class="box">Azure Container Instances — Container Group</text>
  <text x="426" y="314" class="small">IP/DNS publico · containers compartilham localhost</text>

  <!-- spaceguard -->
  <rect x="430" y="330" width="240" height="86" rx="8" fill="#dbeafe" stroke="#6aa6e8"/>
  <text x="446" y="355" class="box">spaceguard :8080</text>
  <text x="446" y="374" class="small">API REST + JWT (Spring Security)</text>
  <text x="446" y="391" class="small">JPA / Hibernate</text>
  <text x="446" y="408" class="small">PUBLICO</text>

  <!-- ingestor -->
  <rect x="690" y="330" width="240" height="86" rx="8" fill="#dbeafe" stroke="#6aa6e8"/>
  <text x="706" y="355" class="box">inpe-ingestor :8083</text>
  <text x="706" y="374" class="small">baixa CSV do INPE</text>
  <text x="706" y="391" class="small">Feign → spaceguard / RabbitMQ</text>
  <text x="706" y="408" class="small">PUBLICO</text>

  <!-- postgres -->
  <rect x="430" y="440" width="240" height="84" rx="8" fill="#fde8e8" stroke="#e29a9a"/>
  <text x="446" y="465" class="box">postgres :5432</text>
  <text x="446" y="484" class="small">Banco em CONTAINER (interno)</text>
  <text x="446" y="501" class="small">schema criado por script-bd.sql</text>
  <text x="446" y="518" class="small">5 tabelas</text>

  <!-- rabbitmq -->
  <rect x="690" y="440" width="240" height="84" rx="8" fill="#f3e8fd" stroke="#c39ae2"/>
  <text x="706" y="465" class="box">rabbitmq :5672</text>
  <text x="706" y="484" class="small">fila focos.queue (interno)</text>
  <text x="706" y="501" class="small">producer: ingestor</text>
  <text x="706" y="518" class="small">consumer: spaceguard</text>

  <!-- conexoes internas ACI -->
  <line x1="550" y1="416" x2="550" y2="440" stroke="#37474f" marker-end="url(#arrow)"/>
  <text x="556" y="432" class="lbl">JDBC</text>
  <line x1="690" y1="373" x2="670" y2="373" stroke="#37474f" marker-end="url(#arrow)"/>
  <text x="600" y="345" class="lbl">HTTP/Feign</text>
  <line x1="810" y1="440" x2="810" y2="416" stroke="#37474f" marker-end="url(#arrow)"/>
  <text x="816" y="432" class="lbl">AMQP</text>
  <line x1="690" y1="482" x2="670" y2="482" stroke="#37474f" marker-end="url(#arrow)"/>
  <text x="600" y="455" class="lbl">consome</text>

  <!-- ===================== INPE externo ===================== -->
  <rect x="410" y="612" width="540" height="66" rx="8" fill="#fff" stroke="#b0bec5" stroke-dasharray="5 4"/>
  <text x="426" y="638" class="box">INPE / TerraBrasilis (servico externo)</text>
  <text x="426" y="658" class="small">GET WFS/CSV — camada ams1h:active-fire-today</text>
  <line x1="810" y1="524" x2="810" y2="612" stroke="#37474f" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="816" y="575" class="lbl">CSV</text>

  <!-- ===================== fluxo CI/CD: DevOps -> Azure ===================== -->
  <!-- push imagens ACR -->
  <line x1="294" y1="500" x2="410" y2="195" stroke="#1b7f4b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="300" y="330" class="lbl" fill="#1b7f4b">push imagens (CI)</text>
  <!-- deploy ACI -->
  <line x1="294" y1="610" x2="410" y2="300" stroke="#b26a00" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="300" y="470" class="lbl" fill="#b26a00">deploy (CD)</text>

  <!-- ===================== Usuario final ===================== -->
  <rect x="1000" y="330" width="150" height="86" rx="8" fill="#ffffff" stroke="#9cc3ec"/>
  <text x="1016" y="358" class="box">Usuario / Insomnia</text>
  <text x="1016" y="378" class="small">CRUD via HTTP</text>
  <text x="1016" y="395" class="small">(JWT Bearer)</text>
  <line x1="1000" y1="373" x2="930" y2="373" stroke="#37474f" marker-end="url(#arrow)"/>

  <!-- ===================== Legenda ===================== -->
  <rect x="40" y="712" width="1100" height="34" rx="6" fill="#ffffff" stroke="#cdd9e5"/>
  <text x="56" y="734" class="small">Legenda:  azul = aplicacao (Spring Boot)   ·   vermelho = banco   ·   roxo = mensageria   ·   verde = recursos Azure   ·   tracejado = servico externo</text>
</svg>
